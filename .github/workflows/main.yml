```yaml
name: Update ICS files

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ics
  cancel-in-progress: false

jobs:
  update-ics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests icalendar

      - name: Run Python script
        run: |
          python ics_transform.py
        env:
          ICS_URL: ${{ secrets.ICS_URL }}

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/lucasstagnette/gpu_edt_lr.git

      - name: Update repository
        run: |
          # Récupère la dernière version de main
          git fetch origin main

          # Se replace sur la dernière version distante
          # tout en conservant les fichiers générés par le script
          git reset --soft origin/main

          # Ajoute uniquement les fichiers ICS
          git add '*.ics'

          # Vérifie s'il y a réellement des changements
          if git diff --cached --quiet; then
            echo "No ICS changes to commit"
            exit 0
          fi

          # Crée le commit
          git commit -m "Update ICS files"

          # Envoie vers GitHub
          git push origin main
```
